# kube-state-metrics (docs/ARCHITECTURE.md section 4.1): the limits and requests of the
# containers and the phase of the pods, so that the dashboard can show the usage the kubelet
# reports as a percentage of the limits. It watches pods only (--resources=pods); the
# ClusterRole that allows it is in monitoring-rbac.yaml, applied once by an administrator.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-state-metrics
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-state-metrics
spec:
  replicas: 1
  selector:
    matchLabels: {app: kube-state-metrics}
  template:
    metadata:
      labels: {app: kube-state-metrics}
    spec:
      serviceAccountName: kube-state-metrics
      securityContext:
        runAsUser: 65534
        runAsNonRoot: true
      containers:
        - name: kube-state-metrics
          image: registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.20.0
          args:
            - --resources=pods
            - --port=8080
            - --telemetry-port=8081
          ports:
            - {name: http, containerPort: 8080}
            - {name: telemetry, containerPort: 8081}
          readinessProbe:
            httpGet: {path: /readyz, port: telemetry}
            periodSeconds: 10
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 256Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: kube-state-metrics
spec:
  selector: {app: kube-state-metrics}
  ports:
    - {name: http, port: 8080}
