# Grafana (docs/ARCHITECTURE.md section 4.1), reached through kubectl only, never through the Ingress:
#   kubectl -n chess port-forward svc/grafana 3000:3000
# then http://localhost:3000 as "admin" with the "grafana-password" key of the "chess" Secret
# (create-secret.sh). Everything is provisioned from the ConfigMaps below, the Prometheus
# datasource and the dashboard, so it keeps no volume: whatever is changed in the UI is lost
# when the pod restarts. Change the dashboard JSON here instead; Grafana re-reads the file
# within seconds.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-provisioning
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
        editable: false
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: chess
        type: file
        disableDeletion: true
        allowUiUpdates: false
        options:
          path: /etc/grafana/dashboards
---
# The dashboard: node and pod CPU and memory (the kubelet's metrics against the machine and
# the limits of kube-state-metrics), the games and players of the API, the engine queue and
# the API request rate and latency. The namespace variable defaults to "chess".
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
data:
  chess.json: |
    {
      "uid": "chess",
      "title": "Chess platform",
      "tags": [
        "chess"
      ],
      "timezone": "browser",
      "editable": true,
      "graphTooltip": 1,
      "refresh": "30s",
      "schemaVersion": 39,
      "version": 1,
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "annotations": {
        "list": []
      },
      "links": [],
      "templating": {
        "list": [
          {
            "name": "namespace",
            "label": "namespace",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "query": {
              "query": "label_values(kube_pod_info, namespace)",
              "refId": "PrometheusVariableQueryEditor-VariableQuery"
            },
            "definition": "label_values(kube_pod_info, namespace)",
            "refresh": 2,
            "sort": 1,
            "includeAll": true,
            "allValue": ".*",
            "multi": false,
            "current": {
              "selected": true,
              "text": "chess",
              "value": "chess"
            },
            "options": []
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "timeseries",
          "title": "Node CPU, % of the cores",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 0
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "custom": {
                "lineWidth": 1,
                "fillOpacity": 10,
                "showPoints": "never"
              },
              "unit": "percent",
              "min": 0,
              "max": 100
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "100 * sum by (node) (rate(node_cpu_usage_seconds_total[2m])) / on (node) sum by (node) (machine_cpu_cores)",
              "legendFormat": "{{node}}"
            }
          ]
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "Node memory, % of the machine",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 0
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "custom": {
                "lineWidth": 1,
                "fillOpacity": 10,
                "showPoints": "never"
              },
              "unit": "percent",
              "min": 0,
              "max": 100
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "100 * sum by (node) (node_memory_working_set_bytes) / on (node) sum by (node) (machine_memory_bytes)",
              "legendFormat": "{{node}}"
            }
