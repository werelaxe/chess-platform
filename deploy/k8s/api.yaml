# One replica, replaced rather than rolled: running games and their WebSockets live in the
# process.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: api}
  template:
    metadata:
      labels: {app: api}
    spec:
      # The server exits when the database refuses connections at startup.
      initContainers:
        - name: wait-for-db
          image: postgres:17-alpine
          command: [sh, -c, "until pg_isready -q -h db; do sleep 2; done"]
      containers:
        - name: api
          image: ghcr.io/werelaxe/chess-platform-api
          env:
            - {name: PORT, value: "8080"}
            - {name: DATABASE_URL, value: "jdbc:postgresql://db:5432/chess"}
            - {name: DATABASE_USER, value: chess}
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef: {name: chess, key: postgres-password}
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef: {name: chess, key: jwt-secret}
            - {name: JWT_TTL_DAYS, value: "30"}
            # The web nginx serves the client and the API from one origin.
            - {name: CORS_ORIGINS, value: ""}
            - {name: ENGINE_URL, value: "http://engine:8081"}
            - {name: JAVA_OPTS, value: -XX:MaxRAMPercentage=75}
          ports:
            - {name: http, containerPort: 8080}
          readinessProbe:
            httpGet: {path: /api/health, port: http}
            periodSeconds: 10
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {memory: 2Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector: {app: api}
  ports:
    - {name: http, port: 8080}
