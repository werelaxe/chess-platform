apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.middlewares: chess-hsts@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts: [quantum-chess.fun]
      secretName: quantum-chess-tls
  rules:
    - host: quantum-chess.fun
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port: {name: http}
---
# Same HSTS policy as the Caddy setup it replaces.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: hsts
spec:
  headers:
    stsSeconds: 604800
