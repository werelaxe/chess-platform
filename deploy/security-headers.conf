# Response headers added to every reply of the web server.
# nginx does not merge add_header across levels: a location that declares its own add_header
# (for example Cache-Control) loses everything inherited, so such locations include this file
# again instead of relying on inheritance.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
