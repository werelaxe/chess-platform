name: CI

on:
  push:
    branches: ["**"]
    tags-ignore: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Core, engine, server and web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      - name: Gradle tests and the core JS library
        run: ./gradlew :core:jvmTest :core:jsNodeTest :core:jsNodeProductionLibraryDistribution :engine:jvmTest :server:test --no-daemon

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Web client
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm run test
          npm run build
