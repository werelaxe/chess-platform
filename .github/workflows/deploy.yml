name: Deploy

# Builds the api, engine and web images, publishes them to GHCR and rolls them out to the
# Kubernetes cluster (deploy/k8s).
# Run it from the Actions tab on master; runs started from any other branch are skipped so
# that only reviewed and merged code reaches the site.
on:
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}

jobs:
  build:
    name: Build ${{ matrix.service }} image
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [api, engine, web]
        include:
          - service: api
            dockerfile: server/Dockerfile
          - service: engine
            dockerfile: engine-service/Dockerfile
          - service: web
            dockerfile: web/Dockerfile
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}
          tags: |
            type=sha,prefix=,format=long
            type=raw,value=latest

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max

  deploy:
    name: Roll out to the cluster
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # The secrets context cannot be used in step conditions, so the token goes through env.
      ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      # KUBE_CONFIG is the kubeconfig printed by deploy/k8s/ci/kubeconfig.sh: it may only change
      # the "chess" namespace. kubectl comes with the runner image.
      # Keeps the "admin-token" key of the "chess" secret equal to the ADMIN_TOKEN GitHub secret.
      # Needs the deployer role from deploy/k8s/ci/deployer.yaml (get/patch on that secret); a
      # cluster without it only loses the admin API, not the deployment.
      - name: Store the admin token in the cluster
        if: ${{ env.ADMIN_TOKEN != '' }}
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          export KUBECONFIG="$RUNNER_TEMP/kubeconfig"
          (umask 077 && printf '%s\n' "$KUBE_CONFIG" > "$KUBECONFIG")
          patch="$RUNNER_TEMP/admin-token.json"
          (umask 077 && printf '{"stringData":{"admin-token":"%s"}}' "$ADMIN_TOKEN" > "$patch")
          if kubectl -n chess patch secret chess --patch-file "$patch" >/dev/null; then
            echo "admin token stored"
          else
            echo "::warning::Could not store the admin token (apply deploy/k8s/ci/deployer.yaml); the admin API stays disabled"
          fi
          rm -f "$patch"

      - name: Apply the manifests with the new images
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          export KUBECONFIG="$RUNNER_TEMP/kubeconfig"
          (umask 077 && printf '%s\n' "$KUBE_CONFIG" > "$KUBECONFIG")
          deploy/k8s/deploy.sh "${{ github.sha }}"

      - name: Check the site
        run: |
          for attempt in $(seq 1 20); do
            if curl -fsS --max-time 10 "${{ vars.SITE_URL }}/api/health"; then echo; exit 0; fi
            sleep 5
          done
          echo "The site did not answer after the deployment" >&2
          exit 1
