name: Deploy

# Builds the api and web images, publishes them to GHCR and updates the server over SSH.
# Run it from the Actions tab (any branch or tag) or push a tag like v1.2.3.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}

jobs:
  build:
    name: Build ${{ matrix.service }} image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [api, web]
        include:
          - service: api
            dockerfile: server/Dockerfile
          - service: web
            dockerfile: web/Dockerfile
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}
          tags: |
            type=sha,prefix=,format=long
            type=raw,value=latest

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max

  deploy:
    name: Update the server
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      SSH_TARGET: ${{ vars.DEPLOY_USER }}@${{ vars.DEPLOY_HOST }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
    steps:
      - uses: actions/checkout@v7

      - name: Prepare SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ vars.DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
          printf 'Host deploy\n  HostName %s\n  User %s\n  IdentityFile ~/.ssh/deploy_key\n  IdentitiesOnly yes\n' \
            "${{ vars.DEPLOY_HOST }}" "${{ vars.DEPLOY_USER }}" > ~/.ssh/config

      - name: Copy the compose files
        run: |
          ssh deploy "mkdir -p '$DEPLOY_PATH/deploy'"
          scp docker-compose.yml docker-compose.prod.yml "deploy:$DEPLOY_PATH/"
          scp deploy/Caddyfile "deploy:$DEPLOY_PATH/deploy/"

      - name: Pull the images and restart the stack
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | ssh deploy "docker login $REGISTRY -u ${{ github.actor }} --password-stdin"
          ssh deploy "cd '$DEPLOY_PATH' && IMAGE_TAG=${{ github.sha }} docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --remove-orphans --wait --wait-timeout 180"
          ssh deploy "docker logout $REGISTRY >/dev/null; docker image prune -f >/dev/null"

      - name: Check the site
        run: |
          for attempt in $(seq 1 20); do
            if curl -fsS --max-time 10 "${{ vars.SITE_URL }}/api/health"; then echo; exit 0; fi
            sleep 5
          done
          echo "The site did not answer after the deployment" >&2
          exit 1
