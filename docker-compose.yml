services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: chess
      POSTGRES_USER: chess
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chess -d chess"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      PORT: "8080"
      DATABASE_URL: jdbc:postgresql://db:5432/chess
      DATABASE_USER: chess
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_TTL_DAYS: "30"
      # nginx serves the client and the API from one origin, so CORS is disabled.
      CORS_ORIGINS: ""
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    # Root context: the image compiles the core library from source (see web/Dockerfile).
    build:
      context: .
      dockerfile: web/Dockerfile
    ports:
      - "80:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  db-data:
