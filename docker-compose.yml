# Keep container logs bounded; read them with `docker compose logs <service>`.
x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:
  engine:
    <<: *logging
    build:
      context: .
      dockerfile: engine-service/Dockerfile
    environment:
      PORT: "8081"
      # Search threads; empty means the CPUs the container sees (ENGINE_CPUS below).
      ENGINE_PARALLELISM: ${ENGINE_PARALLELISM:-}
    deploy:
      resources:
        limits:
          # Searching is the only CPU-heavy work; leave cores for the API and the database.
          cpus: ${ENGINE_CPUS:-0}
    healthcheck:
      # The runtime image ships no HTTP client, so bash's /dev/tcp performs the request.
      test:
        - CMD-SHELL
        - >-
          bash -c 'exec 3<>/dev/tcp/127.0.0.1/8081
          && printf "GET /health HTTP/1.0\r\n\r\n" >&3
          && head -n1 <&3 | grep -q " 200 "' || exit 1
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  db:
    <<: *logging
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: chess
      POSTGRES_USER: chess
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      # Loopback only: lets `./gradlew :server:run` on the host reach the database in development.
      - "127.0.0.1:5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chess -d chess"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  api:
    <<: *logging
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      PORT: "8080"
      DATABASE_URL: jdbc:postgresql://db:5432/chess
      DATABASE_USER: chess
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      JWT_TTL_DAYS: "30"
      # nginx serves the client and the API from one origin, so CORS is disabled.
      CORS_ORIGINS: ""
      # Computer moves come from the engine service; the API falls back to its own engine
      # while the service is unavailable.
      ENGINE_URL: http://engine:8081
    depends_on:
      db:
        condition: service_healthy
      engine:
        condition: service_healthy
    healthcheck:
      # The runtime image ships no HTTP client, so bash's /dev/tcp performs the request.
      test:
        - CMD-SHELL
        - >-
          bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080
          && printf "GET /api/health HTTP/1.0\r\n\r\n" >&3
          && head -n1 <&3 | grep -q " 200 "' || exit 1
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  web:
    <<: *logging
    # Root context: the image compiles the core library from source (see web/Dockerfile).
    build:
      context: .
      dockerfile: web/Dockerfile
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  caddy:
    <<: *logging
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      # Public hostname; leave unset for plain HTTP on localhost (see deploy/Caddyfile).
      SITE_ADDRESS: ${SITE_ADDRESS:-http://localhost}
      WWW_ADDRESS: ${WWW_ADDRESS:-http://www.localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - web
    restart: unless-stopped

volumes:
  db-data:
  caddy-data:
  caddy-config:
